<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTB 3DS Web Server</title>
<style>
/* Tokens from ciaGoober theme/colors.xaml. */
:root { --bg: #1B1B1B; --panel: #2A2A2A; --low: #222222; --hover: #404040; --pressed: #383838; --line: #3F3F3F; --lineStrong: #5E5E5E;
        --accent: #765E98; --accentHover: #9373C0; --accentStrong: #523E6E; --accentBorder: #8363B0; --focus: #AC98C7; --text: #FFFFFF; --tertiary: #CCCCCC; --dim: #B3B3B3; --muted: #888888;
        --ok: #4CAF50; --warn: #E6C200; --bad: #F44336; --dir: #EED076; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
main { max-width: 600px; margin: 0 auto; padding: 12px; display: grid; gap: 12px; }
h1 { font-size: 18px; margin: 0; }
h2 { font-size: 15px; margin: 0; }
section { background: var(--panel); border-radius: 4px; padding: 12px; display: grid; gap: 8px; }
/* Tab strip from ciaGoober's TabControl: 32 px segment, sliding indicator, 180 ms ease-in-out, pages fade in. */
.tabs { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: 32px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.tabs::before { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 1px; background: var(--line); }
.tabs .indicator { position: absolute; top: 0; bottom: 0; left: 0; width: 50%; background: var(--accentStrong); border: 1px solid var(--accentBorder); border-radius: 3px; transition: transform 180ms ease-in-out; pointer-events: none; }
.tabs[data-tab="1"] .indicator { transform: translateX(100%); }
.tabs button { position: relative; background: none; border: none; border-radius: 0; min-height: 0; padding: 0 8px; font: 600 13.5px Consolas, monospace; color: var(--tertiary); transition: color 180ms ease-in-out; }
.tabs button:hover:enabled { background: none; color: var(--text); }
.tabs button[aria-selected=true] { color: var(--text); }
.tabs button:focus-visible { outline-offset: -2px; }
.page { display: grid; gap: 12px; animation: pageIn 180ms ease-in-out; }
@keyframes pageIn { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tabs .indicator, .tabs button { transition: none; } .page { animation: none; } }
textarea { width: 100%; min-height: 72px; resize: vertical; background: var(--low); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; font: inherit; font-family: Consolas, monospace; }
button { background: var(--pressed); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 6px 12px; font: inherit; cursor: pointer; min-height: 32px; }
button:hover:enabled { background: var(--hover); }
button:disabled { opacity: 0.5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); }
button.primary:hover:enabled { background: var(--accentHover); }
button.wide { width: 100%; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.row { display: flex; gap: 6px; }
.row > button { flex: 1; }
.dim { color: var(--dim); }
.muted { color: var(--muted); }
.warn { color: var(--warn); }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
/* SD lists draw like an FTB list on the 3DS top screen (theme colors from genTheme.ps1), a little taller (4:3). They fill the
   section width and scale by --u (a 3DS pixel at 480 px wide, never below 1 CSS px), so narrow pages keep full-size text. */
.sd { container-type: inline-size; position: relative; width: 100%; aspect-ratio: 4 / 3; min-height: 300px; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; background: var(--bg); border: 4px solid #111; border-radius: 4px; }
.sd > * { --u: max(1px, 100cqw / 480); }
.sd.over::after { content: attr(data-drop); position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 12px; text-align: center; font-weight: 600; background: rgba(82, 62, 110, 0.85); outline: 2px solid var(--accentBorder); outline-offset: -2px; pointer-events: none; }
.sd .bar { background: var(--panel); display: flex; align-items: center; min-width: 0; height: calc(var(--u) * 22); padding: 0 calc(var(--u) * 6); font-size: calc(var(--u) * 13); white-space: nowrap; position: relative; z-index: 1; }
.sd .top { box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); font-family: Consolas, monospace; }
/* rtl puts the ellipsis on the left so the current folder stays visible; the bdi keeps the path itself ltr. */
.sd .top span { overflow: hidden; text-overflow: ellipsis; direction: rtl; }
.sd .bottom { box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.6); justify-content: center; }
.sd ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; scrollbar-color: #545454 transparent; }
.sd li { display: flex; align-items: center; gap: calc(var(--u) * 8); padding: 0 calc(var(--u) * 6); min-height: calc(var(--u) * 24); font-size: calc(var(--u) * 15); }
.sd li:has(button, label):hover { background: var(--hover); }
.sd li.on { background: var(--accent); }
.sd li.on .dim { color: var(--text); }
.sd li > .dim { flex: none; font-size: calc(var(--u) * 13); }
.sd li :focus-visible { outline-offset: -2px; }
.sd .name { flex: 1; min-width: 0; align-self: stretch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.sd button.name { background: none; border: none; padding: 0; min-height: 0; border-radius: 0; color: var(--dir); }
.sd span.name { align-self: center; }
.sd label.name { cursor: pointer; display: flex; gap: calc(var(--u) * 8); align-items: center; }
.sd input[type=checkbox] { width: calc(var(--u) * 13); height: calc(var(--u) * 13); margin: 0; }
.sd label.name span { overflow: hidden; text-overflow: ellipsis; }
#results { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; }
#results li { overflow-wrap: anywhere; }
progress, input[type=checkbox] { accent-color: var(--accent); }
progress { width: 100%; height: 10px; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--lineStrong); border-radius: 4px; max-width: 520px; padding: 16px; }
dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
dialog ul { padding-left: 18px; font-family: Consolas, monospace; max-height: 40vh; overflow: auto; overflow-wrap: anywhere; }
dialog .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<main>
<h1>FTB 3DS Web Server</h1>

<div class="tabs" role="tablist" aria-label="Transfer direction" data-tab="0">
<span class="indicator"></span>
<button type="button" role="tab" id="tabSend" aria-controls="pageSend" aria-selected="true">Send to 3DS</button>
<button type="button" role="tab" id="tabDownload" aria-controls="pageDownload" aria-selected="false" tabindex="-1">Download from 3DS</button>
</div>

<div class="page" id="pageSend" role="tabpanel" aria-labelledby="tabSend">
<section aria-label="3DS SD card">
<div id="browser" class="sd"></div>
<div class="row">
<button type="button" class="primary" id="addFiles" title="Saves files in the open folder. Files and folders can also be dropped onto the list.">Add files</button>
<button type="button" class="primary" id="installFiles" title="Installs CIA, ticket (.tik, .cetk), and 3DSX files.">Install CIA</button>
</div>
<input id="pickFiles" type="file" multiple hidden>
<input id="pickInstall" type="file" multiple accept=".cia,.tik,.cetk,.3dsx" hidden>
</section>

<section aria-labelledby="linksTitle">
<h2 id="linksTitle"><label for="links">Links</label></h2>
<textarea id="links" spellcheck="false" autocomplete="off" placeholder="https://example.com/game.cia"></textarea>
<div class="row">
<button type="button" class="primary" id="saveLinks" title="The 3DS downloads the links into the open folder.">Save links</button>
<button type="button" class="primary" id="installLinks" title="The 3DS installs CIA, ticket, and 3DSX links; other files save to the open folder.">Install links</button>
</div>
</section>
</div>

<div class="page" id="pageDownload" role="tabpanel" aria-labelledby="tabDownload" hidden>
<section>
<div id="downloadList" class="sd"></div>
<button type="button" class="primary wide" id="downloadFiles" disabled title="Each file is a separate download; the browser may ask to allow multiple downloads.">Download files</button>
</section>
</div>

<section id="status" aria-live="polite" hidden>
<div id="statusText"></div>
<div id="wait" class="warn" hidden></div>
<progress id="bar" max="1" value="0" hidden></progress>
<ul id="results"></ul>
</section>
</main>

<dialog id="conflict" aria-labelledby="conflictTitle">
<form method="dialog">
<h2 id="conflictTitle"></h2>
<ul id="conflictList"></ul>
<p id="conflictNote" class="dim" hidden>Reinstalling deletes the installed copy first. Its save data may be deleted too: back it up with Checkpoint.</p>
<div class="actions"><button value="cancel">Cancel</button><button value="skip">Skip these</button><button value="replace" class="primary" id="conflictConfirm"></button></div>
</form>
</dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
const INSTALL_EXT = [".cia", ".tik", ".cetk", ".3dsx"];
const FILE_MAX = 0xFFFFFFFF; // FAT32
const FILES_MAX = 1000;
const LINKS_MAX = 128;
const WAIT_TEXT = "Waiting for the 3DS: approve this device there if it asks.";
const OFFER_WAIT = "Waiting for the 3DS: approve this device and accept the transfer there if it asks.";
const LINKS_WAIT = "Waiting for the 3DS: approve and accept there if it asks; then the 3DS downloads the links.";

// The 3DS remembers approved browsers by this key (Settings > 3DS Web Server devices: Ask once).
// SameSite=Strict: requests that other sites start never carry it.
let deviceKey = localStorage.getItem("ftbDevice") || "";
if (!/^[0-9a-f]{32}$/.test(deviceKey)) {
    deviceKey = Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, "0")).join("");
    localStorage.setItem("ftbDevice", deviceKey);
}
document.cookie = "ftbDevice=" + deviceKey + "; path=/; max-age=34560000; samesite=strict";

let busy = false;
let idleTasks = [];

const size = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KiB" : n < 1073741824 ? (n / 1048576).toFixed(1) + " MiB" : (n / 1073741824).toFixed(2) + " GiB";
const count = (n, word) => n + " " + word + (n === 1 ? "" : "s");
const lastPart = path => path.slice(path.lastIndexOf("/") + 1);
const installable = path => INSTALL_EXT.some(ext => path.toLowerCase().endsWith(ext));
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

function show(text, kind) {
    $("status").hidden = false;
    $("statusText").textContent = text;
    $("statusText").className = kind || "";
}

function showResults(lines) {
    $("results").textContent = "";
    for (const line of lines) $("results").append(el("li", line.kind, line.text));
}

function setBusy(value) {
    busy = value;
    for (const id of ["addFiles", "installFiles", "saveLinks", "installLinks"]) $(id).disabled = value;
    refresh();
    while (!busy && idleTasks.length > 0) idleTasks.shift()();
}

// Runs task now, or once the current transfer ends (requests never overlap: the 3DS serves one at a time).
function whenIdle(task) {
    if (busy) idleTasks.push(task);
    else task();
}

// One request to the 3DS. A request still pending after a second may be waiting on a prompt there.
async function api(path, body, waitText = WAIT_TEXT) {
    const timer = waitText ? setTimeout(() => { $("status").hidden = false; $("wait").textContent = waitText; $("wait").hidden = false; }, 1000) : 0;
    try {
        let response;
        try {
            response = await fetch(path, body === undefined ? {headers: {"X-FTB": "1"}} : {method: "POST", headers: {"X-FTB": "1", "Content-Type": "application/json"}, body: JSON.stringify(body)});
        } catch (error) {
            const lost = new Error("Lost the connection to the 3DS.");
            lost.network = true;
            throw lost;
        }
        const reply = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(reply.error || "The 3DS answered " + response.status + ".");
        return reply;
    } finally {
        clearTimeout(timer);
        $("wait").hidden = true;
        if ($("statusText").textContent === "" && $("results").children.length === 0 && $("bar").hidden) $("status").hidden = true;
    }
}

// Asks about uploads that would replace something; resolves "cancel", "skip", or "replace".
function askConflict(installed, lines, saveNote) {
    const dialog = $("conflict");
    $("conflictTitle").textContent = installed ? "Already installed" : "Already on the SD card";
    $("conflictTitle").className = installed ? "warn" : "";
    $("conflictList").textContent = "";
    for (const line of lines) $("conflictList").append(el("li", "", line));
    $("conflictNote").hidden = !saveNote;
    $("conflictConfirm").textContent = installed ? "Reinstall" : "Replace";
    return new Promise(resolve => {
        dialog.returnValue = "";
        dialog.onclose = () => resolve(dialog.returnValue || "cancel");
        dialog.showModal();
    });
}

// Mirrors web_join_path's rules for one name: what the 3DS would refuse is refused here first.
function nameAllowed(name) {
    return name !== "" && name !== "." && name !== ".." && !/[. ]$/.test(name) && !/[\x00-\x1F\x7F\\/:*?"<>|]/.test(name) && name.length <= 255;
}

// The name a saved link gets on the 3DS (web_url_file_name): the URL path's last part, decoded.
function linkName(link) {
    const url = /^https?:\/\//.test(link) ? link : "http://" + link;
    const rest = url.slice(url.indexOf("://") + 3).split(/[?#]/)[0];
    const slash = rest.lastIndexOf("/");
    if (slash < 0) return null;
    try {
        const name = decodeURIComponent(rest.slice(slash + 1));
        return nameAllowed(name) ? name : null;
    } catch (error) {
        return null;
    }
}

// Title ID and version from a CIA's TMD, read like cia_get_title_id; null when it does not parse.
async function ciaInfo(file) {
    try {
        const head = new DataView(await file.slice(0, 0x20).arrayBuffer());
        // Same test as the 3DS (header size 0x2020), which goes by content, not the file name.
        if (head.byteLength < 0x20 || head.getUint16(0, true) !== 0x2020) return null;
        const align = n => Math.ceil(n / 64) * 64;
        const tmd = align(head.getUint32(0, true)) + align(head.getUint32(8, true)) + align(head.getUint32(12, true));
        const data = new DataView(await file.slice(tmd, tmd + 0x240 + 0xA0).arrayBuffer());
        const sigSize = data.byteLength >= 4 ? [0x240, 0x140, 0x80, 0x240, 0x140, 0x80][data.getUint8(3)] : undefined;
        if (sigSize === undefined || data.byteLength < sigSize + 0x9E) return null;
        const hex = offset => data.getUint32(sigSize + offset).toString(16).toUpperCase().padStart(8, "0");
        const version = data.getUint16(sigSize + 0x9C);
        return {titleId: hex(0x4C) + hex(0x50), version: (version >> 10 & 0x3F) + "." + (version >> 4 & 0x3F) + "." + (version & 0xF)};
    } catch (error) {
        return null;
    }
}

// One SD listing: Send's folder (uploads go to the open one) and Download's file picker (pick set).
function sdList(box, pick, onChange) {
    const view = {path: "/", entries: [], free: undefined, selected: new Set(), error: "", loaded: false};

    view.load = async (path, fallback) => {
        try {
            const reply = await api("/list?path=" + encodeURIComponent(path));
            view.path = reply.path;
            view.entries = reply.entries;
            view.free = reply.free;
            view.error = "";
        } catch (error) {
            if (fallback && path !== "/") return view.load("/", false);
            view.error = error.message;
        }
        view.loaded = true;
        view.selected.clear();
        render();
        return view.error === "";
    };

    const go = path => whenIdle(async () => {
        setBusy(true);
        await view.load(path, false);
        setBusy(false);
    });

    function folderRow(text, onClick) {
        const button = el("button", "name", text);
        button.type = "button";
        button.addEventListener("click", onClick);
        const li = el("li");
        li.append(button);
        return li;
    }

    function render() {
        box.textContent = "";
        const top = el("div", "bar top");
        const path = el("span");
        path.append(el("bdi", "", "sdmc:" + view.path));
        top.append(path);

        const list = el("ul");
        const dirs = view.entries.filter(entry => entry.dir);
        const fileEntries = view.entries.filter(entry => !entry.dir);
        let all;
        const checks = [];
        function updateSelection() {
            for (const [check, li, name] of checks) {
                check.checked = view.selected.has(name);
                li.className = check.checked ? "on" : "";
            }
            if (all) {
                all.checked = view.selected.size === fileEntries.length;
                all.indeterminate = view.selected.size > 0 && !all.checked;
            }
            onChange(view);
        }
        if (view.path !== "/") list.append(folderRow("..", () => go(view.path.replace(/[^/]*\/$/, ""))));
        if (view.error) list.append(el("li", "bad", view.error));
        else if (view.entries.length === 0) list.append(el("li", "muted", "Empty folder"));

        for (const entry of dirs) list.append(folderRow(entry.name + "/", () => go(view.path + entry.name + "/")));

        if (pick && fileEntries.length > 1) {
            all = el("input");
            all.type = "checkbox";
            all.checked = view.selected.size === fileEntries.length;
            all.indeterminate = view.selected.size > 0 && !all.checked;
            all.addEventListener("change", () => {
                view.selected = new Set(all.checked ? fileEntries.map(entry => entry.name) : []);
                updateSelection();
            });
            const label = el("label", "name muted");
            label.append(all, "Select all files");
            const li = el("li");
            li.append(label);
            list.append(li);
        }

        for (const entry of fileEntries) {
            const li = el("li");
            if (pick) {
                const check = el("input");
                check.type = "checkbox";
                check.checked = view.selected.has(entry.name);
                check.addEventListener("change", () => {
                    if (check.checked) view.selected.add(entry.name);
                    else view.selected.delete(entry.name);
                    updateSelection();
                });
                const label = el("label", "name");
                label.append(check, el("span", "", entry.name));
                li.className = check.checked ? "on" : "";
                li.append(label);
                checks.push([check, li, entry.name]);
            } else {
                li.append(el("span", "name", entry.name));
            }
            li.append(el("span", "dim", size(entry.size)));
            list.append(li);
        }

        const bottom = el("div", "bar bottom", view.free === undefined ? "" : "SD: " + size(view.free) + " free");
        box.append(top, list, bottom);
        onChange(view);
    }

    return view;
}

const browser = sdList($("browser"), false, view => {
    if (!view.error) localStorage.setItem("ftbDest", view.path);
});

const downloads = sdList($("downloadList"), true, view => {
    if (!view.error) localStorage.setItem("ftbDownloadPath", view.path);
    refresh();
});

// The download button says exactly what pressing it does.
function refresh() {
    const picked = downloads.entries.filter(entry => !entry.dir && downloads.selected.has(entry.name));
    const bytes = picked.reduce((sum, entry) => sum + entry.size, 0);
    $("downloadFiles").textContent = picked.length === 0 ? "Download files" : "Download " + count(picked.length, "file") + " (" + size(bytes) + ")";
    $("downloadFiles").disabled = busy || picked.length === 0;
}

// Adds a dropped file or folder to out ({file, path}); folders keep their layout under the SD folder.
async function walk(entry, out) {
    if (entry.isFile) {
        const path = entry.fullPath.replace(/^\/+/, "");
        const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
        if (!out.some(item => item.path === path)) out.push({file, path});
        return;
    }
    const reader = entry.createReader();
    for (;;) {
        const entries = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
        if (entries.length === 0) break;
        for (const child of entries) {
            if (!child.name.startsWith(".")) await walk(child, out);
        }
    }
}

function upload(token, files, total) {
    return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/data?token=" + token);
        xhr.setRequestHeader("X-FTB", "1");
        const started = Date.now();
        xhr.upload.onprogress = event => {
            $("bar").value = event.loaded / total;
            const seconds = (Date.now() - started) / 1000;
            show("Sending " + size(event.loaded) + " of " + size(total) + (seconds > 1 ? ", " + size(event.loaded / seconds) + "/s" : ""), "");
        };
        xhr.onload = () => {
            let reply = null;
            try { reply = JSON.parse(xhr.responseText); } catch (error) { reply = null; }
            if (xhr.status === 200 && reply && Array.isArray(reply.results)) resolve(reply.results);
            else reject(new Error((reply && reply.error) || "The 3DS answered " + xhr.status + "."));
        };
        xhr.onerror = () => reject(new Error("Stopped on the 3DS or connection lost."));
        // Blob parts refer to the files: the browser streams them from disk.
        xhr.send(new Blob(files));
    });
}

function resultLines(names, results, installs) {
    return results.map((result, i) => result.ok ? {text: (installs[i] ? "Installed: " : "Saved: ") + names[i], kind: "ok"}
        : result.skipped ? {text: "Skipped (" + result.error + "): " + names[i], kind: "dim"}
        : {text: "Failed: " + names[i] + ": " + result.error, kind: "bad"});
}

function finish(results, total, verb) {
    const failed = results.filter(result => !result.ok).length;
    show(failed === 0 ? "Done." : failed + " of " + total + " not " + verb + ".", failed === 0 ? "ok" : "bad");
    return failed;
}

// Sends picked files ({file, path}) to the open SD folder. With install, CIA, ticket, and 3DSX files
// install instead of saving there.
async function sendFiles(picked, install, dest = browser.path) {
    let items = picked.map(item => ({file: item.file, path: item.path, size: item.file.size, install: install && installable(item.path)}));
    if (items.length === 0) return;
    const tooBig = items.find(item => item.size > FILE_MAX);
    const tooSmall = items.find(item => item.install && item.size < 4);
    if (items.length > FILES_MAX) return show("Send " + FILES_MAX + " files or fewer at a time.", "bad");
    if (tooBig) return show(tooBig.path + " is over 4 GiB, which the SD card cannot hold.", "bad");
    if (tooSmall) return show(tooSmall.path + " is too small to install.", "bad");

    const ownBusy = !busy;
    setBusy(true);
    showResults([]);
    $("status").hidden = false;
    try {
        // Ask about anything that would be replaced before a byte moves.
        const cias = items.filter(item => item.install);
        for (const item of cias) {
            item.cia = await ciaInfo(item.file);
            const magic = new DataView(await item.file.slice(0, 4).arrayBuffer());
            item.homebrew = magic.byteLength === 4 && magic.getUint32(0, true) === 0x58534433;
        }
        const brews = items.filter(item => item.homebrew);
        const check = {
            dest,
            saves: items.filter(item => !item.install).map(item => item.path),
            titles: [...new Set(cias.filter(item => item.cia).map(item => item.cia.titleId))],
            homebrew: [...new Set(brews.map(item => lastPart(item.path)))]
        };

        let replace = false;
        if (check.saves.length + check.titles.length + check.homebrew.length > 0) {
            show("Checking the SD card", "");
            const reply = await api("/check", check);
            const exists = new Set(reply.exists);
            if (exists.size > 0) {
                const answer = await askConflict(false, [...exists].map(path => dest + path), false);
                if (answer === "cancel") return show("Cancelled.", "");
                if (answer === "skip") items = items.filter(item => item.install || !exists.has(item.path));
                else replace = true;
            }

            const versions = new Map(reply.installed.map(title => [title.titleId, title.version]));
            const homebrew = new Set(reply.homebrew);
            const again = items.filter(item => item.install && (item.cia ? versions.has(item.cia.titleId) : homebrew.has(lastPart(item.path)) && brews.includes(item)));
            if (again.length > 0) {
                const lines = again.map(item => {
                    const name = lastPart(item.path);
                    if (item.cia) return name + ": " + item.cia.titleId + ", installed v" + versions.get(item.cia.titleId) + ", sending v" + item.cia.version;
                    const base = name.lastIndexOf(".") >= 0 ? name.slice(0, name.lastIndexOf(".")) : name;
                    return name + ": /3ds/" + base + "/" + base + ".3dsx";
                });
                const answer = await askConflict(true, lines, again.some(item => item.cia));
                if (answer === "cancel") return show("Cancelled.", "");
                if (answer === "skip") items = items.filter(item => !again.includes(item));
            }
        }

        if (items.length === 0) return show("Nothing left to send.", "");

        const total = items.reduce((sum, item) => sum + item.size, 0);
        show("Asking the 3DS", "");
        const offer = await api("/offer", {dest, replace, files: items.map(({path, size, install}) => ({path, size, install}))}, OFFER_WAIT);
        if (!offer.accepted) return show("Declined on the 3DS.", "bad");

        $("bar").value = 0;
        $("bar").hidden = false;
        const results = await upload(offer.token, items.map(item => item.file), total);
        showResults(resultLines(items.map(item => item.path), results, items.map(item => item.install)));
        finish(results, items.length, "sent");
        await browser.load(dest, false);
    } catch (error) {
        show(error.message, "bad");
    } finally {
        $("bar").hidden = true;
        if (ownBusy) setBusy(false);
    }
}

// Per line: its http(s) links when it has any (links pasted among other text), else the whole line
// (the 3DS takes links without a scheme too).
function linksFrom(text) {
    const links = text.split(/\r?\n/).flatMap(line => {
        const tokens = line.split(/\s+/).filter(token => /^https?:\/\//i.test(token));
        return tokens.length > 0 ? tokens : [line.trim()];
    }).filter(link => link !== "");
    return [...new Set(links)];
}

async function sendLinks(install) {
    let links = linksFrom($("links").value);
    if (links.length === 0) return show("Enter at least one link.", "bad");
    if (links.length > LINKS_MAX) return show("Send " + LINKS_MAX + " links or fewer at a time.", "bad");

    const dest = browser.path;
    let names = links.map(linkName);
    if (!install) {
        const nameless = links.find((link, i) => names[i] === null);
        if (nameless) return show("No usable file name in " + nameless, "bad");
        const twice = names.find((name, i) => names.findIndex(other => other.toLowerCase() === name.toLowerCase()) !== i);
        if (twice) return show("Two links would save as " + twice + ".", "bad");
    }

    setBusy(true);
    showResults([]);
    $("status").hidden = false;
    try {
        let replace = false;
        if (!install) {
            show("Checking the SD card", "");
            const exists = new Set((await api("/check", {dest, saves: names})).exists);
            if (exists.size > 0) {
                const answer = await askConflict(false, [...exists].map(name => dest + name), false);
                if (answer === "cancel") return show("Cancelled.", "");
                if (answer === "skip") {
                    links = links.filter((link, i) => !exists.has(names[i]));
                    names = names.filter(name => !exists.has(name));
                } else {
                    replace = true;
                }
            }
            if (links.length === 0) return show("Nothing left to send.", "");
        }

        show("Asking the 3DS", "");
        const reply = await api("/offer", {links, install, dest, replace}, LINKS_WAIT);
        if (!reply.accepted) return show("Declined on the 3DS.", "bad");
        showResults(resultLines(install ? links : names.map(name => dest + name), reply.results, links.map(() => install)));
        finish(reply.results, links.length, install ? "installed" : "saved");
        await browser.load(dest, false);
    } catch (error) {
        show(error.message, "bad");
    } finally {
        setBusy(false);
    }
}

// Waits until the 3DS has answered the download that was just started. /status is answered only
// between transfers, so a slow answer means the download ran. Null when the browser never asked.
async function waitDownload(before, name, position) {
    let idle = 0;
    let networkErrors = 0;
    for (;;) {
        const started = Date.now();
        try {
            const status = await api("/status", undefined, "");
            networkErrors = 0;
            if (status.downloads > before.downloads) return status;
        } catch (error) {
            if (!error.network) throw error;
            if (++networkErrors >= 3) throw error;
            await sleep(1000); // Firefox gives up on a response after 300 s; ask again
            continue;
        }
        idle = Date.now() - started > 3000 ? 0 : idle + 500;
        if (idle > 60000) return null;
        if (idle > 3000) show(position + ": " + name + ". If the browser asks, allow downloads from this page.", "");
        await sleep(500);
    }
}

async function downloadFiles() {
    const folderPath = downloads.path;
    const picked = downloads.entries.filter(entry => !entry.dir && downloads.selected.has(entry.name));
    setBusy(true);
    showResults([]);
    const lines = [];
    let failed = 0;
    try {
        let status = await api("/status");
        for (let i = 0; i < picked.length; i++) {
            const name = picked[i].name;
            const position = "Downloading " + (i + 1) + " of " + picked.length;
            show(position + ": " + name, "");
            const link = el("a");
            link.href = "/file?path=" + encodeURIComponent(folderPath + name);
            link.download = name;
            document.body.append(link);
            link.click();
            link.remove();

            const next = await waitDownload(status, name, position);
            if (next === null) {
                lines.push({text: "Not started: " + name, kind: "bad"});
                showResults(lines);
                return show("The browser did not start the download. Allow downloads from this page, then try again.", "bad");
            }
            const ok = next.failed === status.failed;
            failed += ok ? 0 : 1;
            lines.push(ok ? {text: "Downloaded: " + folderPath + name, kind: "ok"} : {text: "Failed: " + folderPath + name + " (stopped on the 3DS or not found)", kind: "bad"});
            showResults(lines);
            status = next;
        }
        show(failed === 0 ? "Done." : failed + " of " + picked.length + " not downloaded.", failed === 0 ? "ok" : "bad");
    } catch (error) {
        show(error.message, "bad");
    } finally {
        setBusy(false);
    }
}

$("addFiles").addEventListener("click", () => $("pickFiles").click());
$("installFiles").addEventListener("click", () => $("pickInstall").click());
for (const [id, install] of [["pickFiles", false], ["pickInstall", true]]) {
    $(id).addEventListener("change", event => {
        const picked = [...event.target.files].map(file => ({file, path: file.name}));
        event.target.value = "";
        if (!busy) sendFiles(picked, install);
    });
}

const hasFiles = event => event.dataTransfer !== null && [...event.dataTransfer.types].includes("Files");

// A file dropped outside the SD list must not open in this tab and leave the page.
for (const type of ["dragover", "drop"]) document.addEventListener(type, event => { if (hasFiles(event)) event.preventDefault(); });

// Files and folders dropped on the SD list save in its open folder.
const drop = $("browser");
for (const type of ["dragenter", "dragover"]) {
    drop.addEventListener(type, event => {
        if (!hasFiles(event) || busy) return;
        event.preventDefault();
        drop.dataset.drop = "Save in sdmc:" + browser.path;
        drop.classList.add("over");
    });
}
drop.addEventListener("dragleave", event => { if (!drop.contains(event.relatedTarget)) drop.classList.remove("over"); });
drop.addEventListener("drop", async event => {
    drop.classList.remove("over");
    if (!hasFiles(event) || busy) return;
    event.preventDefault();
    const entries = [...event.dataTransfer.items].map(item => item.webkitGetAsEntry && item.webkitGetAsEntry()).filter(Boolean);
    const files = [...event.dataTransfer.files];
    const picked = [];
    const dest = browser.path;
    setBusy(true);
    try {
        if (entries.length > 0) {
            for (const entry of entries) await walk(entry, picked);
        } else {
            for (const file of files) picked.push({file, path: file.name});
        }
        await sendFiles(picked, false, dest);
    } catch (error) {
        return show("Could not read the dropped files: " + error.message, "bad");
    } finally {
        setBusy(false);
    }
});

$("saveLinks").addEventListener("click", () => { if (!busy) sendLinks(false); });
$("installLinks").addEventListener("click", () => { if (!busy) sendLinks(true); });
$("downloadFiles").addEventListener("click", () => { if (!busy) downloadFiles(); });

const TABS = [{tab: "tabSend", page: "pageSend", list: browser, saved: "ftbDest"}, {tab: "tabDownload", page: "pageDownload", list: downloads, saved: "ftbDownloadPath"}];

// Each tab's SD listing loads on its first open, at the folder it showed last.
function showTab(index, focus) {
    TABS.forEach((entry, i) => {
        $(entry.tab).setAttribute("aria-selected", i === index);
        $(entry.tab).tabIndex = i === index ? 0 : -1;
        $(entry.page).hidden = i !== index;
    });
    document.querySelector(".tabs").dataset.tab = index;
    localStorage.setItem("ftbTab", index);
    if (focus) $(TABS[index].tab).focus();
    const {list, saved} = TABS[index];
    if (list.loaded) return;
    whenIdle(async () => {
        if (list.loaded) return;
        setBusy(true);
        await list.load(localStorage.getItem(saved) || "/", true);
        setBusy(false);
    });
}

TABS.forEach((entry, i) => {
    $(entry.tab).addEventListener("click", () => showTab(i, false));
    $(entry.tab).addEventListener("keydown", event => {
        const step = {ArrowLeft: -1, ArrowRight: 1}[event.key];
        if (step) showTab((i + step + TABS.length) % TABS.length, true);
    });
});

showTab(localStorage.getItem("ftbTab") === "1" ? 1 : 0, false);
</script>
